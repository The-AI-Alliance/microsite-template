name: CI

# Because the website is static, by default, we don't do any CI checks for website
# changes (under the docs directory), but if you add JavaScript content later, consider
# adding the appropriate paths (e.g., *.json, *.js, and *.ts) and "quality steps" below.
on:
  pull_request:
    branches:
      - main
    paths:
      - "**/.*.mk"
      - "**/Makefile"
      - "**/*.toml"
      - ".github/workflows/*.yml"
      - "src/**"

jobs:
  quality:
    name: Format · Lint · Type-check · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: uv download cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # Do not cache .venv. Restored venvs keep a python3 symlink into the
      # runner image; that path can disappear on the next image, causing the
      # `if [ ! -d .venv ]` then skips recreation. Keep the uv download cache.
      # - name: Cache virtualenv
      #   uses: actions/cache@v6
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-py3.13-${{ hashFiles('pyproject.toml') }}
      #     restore-keys: |
      #       venv-${{ runner.os }}-py3.13-

      # - name: Create virtual environment (if cache miss)
      #   run: |
      #     if [ ! -d .venv ]; then
      #       uv venv --no-managed-python
      #     fi

      - name: Create virtual environment (if cache miss)
        run: uv venv --no-managed-python

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Run before-pr checks
        run: make GITHUB_CI='true' before-pr
